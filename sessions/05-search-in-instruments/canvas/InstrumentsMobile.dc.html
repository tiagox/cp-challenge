<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instrumentos mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0062DE}a:hover{color:#0052BD}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid #E5E9EF;background:#FFFFFF;color:#00152E;display:inline-flex;align-items:center;justify-content:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;text-decoration:none;color:#597291;font-size:12px;font-weight:600}
.tab.active{color:#0062DE}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F7FD; color: #00152E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <header style="height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E5E9EF; background: rgba(242,247,253,0.9)">
    <a href="#" style="text-decoration: none; color: #00152E; font-weight: 800; font-size: 17px">CP Invest</a>
    <div style="display: flex; gap: 8px">
      <button class="iconbtn" aria-label="Cambiar a tema oscuro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
      <select aria-label="Idioma" style="font: inherit; font-weight: 600; color: #00152E; background: #FFFFFF; border: 1px solid #E5E9EF; border-radius: 999px; height: 44px; padding: 0 10px"><option>ES</option><option>EN</option></select>
    </div>
  </header>
  <main style="padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin-bottom: 4px">
      <h1 style="margin: 0 0 4px; font-size: 24px; font-weight: 800">Instrumentos</h1>
      <p style="margin: 0; color: #597291; font-size: 14px">Explorá los instrumentos disponibles y enviá una orden.</p>
    </div>
    <div role="search">
      <label for="qm" style="display: block; font-size: 13px; font-weight: 600; color: #597291; margin-bottom: 6px">Buscar por ticker</label>
      <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 4px 0 14px; background: #FFFFFF; border: 2px solid #0062DE; border-radius: 14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#597291" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="qm" type="search" value="ar" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 16px; font-weight: 600; color: #00152E; background: transparent">
        <button aria-label="Limpiar búsqueda" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #597291; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
    </div>
    <p role="status" style="margin: 0; font-size: 13px; color: #597291">4 resultados para “ar”</p>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E5E9EF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <div style="min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 800; font-size: 16px">{{r.ticker}}</span><span style="font-size: 11px; font-weight: 700; color: #597291; background: #EDF2F7; border-radius: 999px; padding: 2px 8px">Acciones</span></div>
            <div style="color: #597291; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
          </div>
          <div style="text-align: right">
            <div style="font-weight: 700; font-size: 16px">{{r.price}}</div>
            <div style="font-weight: 700; font-size: 13px; color: {{r.tone}}">{{r.ret}}</div>
          </div>
        </div>
        <button style="font: inherit; font-weight: 700; font-size: 15px; height: 44px; border: 0; border-radius: 999px; background: #0062DE; color: #FFFFFF; width: 100%">Operar</button>
      </article>
    </sc-for>
  </main>
  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #FFFFFF; border-top: 1px solid #E5E9EF; padding-bottom: 18px">
    <a class="tab active" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>Instrumentos</a>
    <a class="tab" href="PortfolioMobile.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Portafolio</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pos = '#07785A';
    return { rows: [
      { ticker: 'GARO', name: 'Garovaglio Y Zorraquín', price: '$ 27,12', ret: '+10,97%', tone: pos },
      { ticker: 'HARG', name: 'Holcim (Argentina) S.A.', price: '$ 78,25', ret: '+10,01%', tone: pos },
      { ticker: 'BBAR', name: 'Banco Frances', price: '$ 79,36', ret: '+10,73%', tone: pos }
    ] };
  }
}
</script>
</body>
</html>
