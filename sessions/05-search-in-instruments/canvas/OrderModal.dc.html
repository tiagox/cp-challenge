<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orden desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0062DE}a:hover{color:#0052BD}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:#EDF2F7;border-radius:999px}
.segbtn{font:inherit;font-weight:700;font-size:14px;height:40px;border:0;border-radius:999px;background:transparent;color:#597291}
.segbtn.on{background:#0062DE;color:#FFFFFF}
.lbl{display:block;font-size:13px;font-weight:600;color:#00152E;margin-bottom:6px}
.inp{box-sizing:border-box;width:100%;height:48px;padding:0 14px;font:inherit;font-size:16px;font-weight:600;color:#00152E;background:#FFFFFF;border:1px solid #C9D3DF;border-radius:12px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:#597291;margin-top:6px}
</style>
</helmet>
<div style="width: 1280px; height: 860px; position: relative; overflow: hidden; background: #F2F7FD; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #00152E">
  <div aria-hidden="true" style="height: 64px; border-bottom: 1px solid #E5E9EF"></div>
  <div aria-hidden="true" style="max-width: 1152px; margin: 32px auto 0; height: 600px; background: #FFFFFF; border: 1px solid #E5E9EF; border-radius: 16px"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,21,46,0.45); display: flex; align-items: center; justify-content: center">
    <section role="dialog" aria-modal="true" aria-labelledby="ot" style="width: 560px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 24px 48px rgba(0,21,46,0.25); overflow: hidden">
      <div style="padding: 20px 24px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #E5E9EF">
        <div>
          <h2 id="ot" style="margin: 0; font-size: 20px; font-weight: 800">Nueva orden · DYCA</h2>
          <p style="margin: 4px 0 0; font-size: 14px; color: #597291">Dycasa S.A. · Último precio <strong style="color: #00152E; font-variant-numeric: tabular-nums">$ 45,72</strong></p>
        </div>
        <button aria-label="Cerrar" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #EDF2F7; color: #00152E; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
      <form style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div class="seg" role="group" aria-label="Operación"><button type="button" class="segbtn on" aria-pressed="true">Compra</button><button type="button" class="segbtn" aria-pressed="false">Venta</button></div>
          <div class="seg" role="group" aria-label="Tipo"><button type="button" class="segbtn on" aria-pressed="true">Mercado</button><button type="button" class="segbtn" aria-pressed="false">Límite</button></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div><label class="lbl" for="qty">Cantidad de acciones</label><input class="inp" id="qty" type="number" value="100"></div>
          <div><label class="lbl" for="amt">Monto ($)</label><input class="inp" id="amt" type="number" value="4572.00"><div class="hint">Calculamos las acciones enteras al último precio.</div></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #597291"><span>Efectivo disponible</span><span style="font-weight: 700; color: #00152E; font-variant-numeric: tabular-nums">$ 980.400,00</span></div>
        <div style="background: #EDF2F7; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-weight: 600">Total estimado</span>
          <span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">$ 4.572,00</span>
        </div>
        <div aria-live="polite" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #E6F6EB; color: #07785A; font-size: 14px; font-weight: 600">
          <span style="background: #FFFFFF; color: #07785A; border: 1px solid #07785A; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700">Ejecutada · FILLED</span>
          <span>Orden #648128 enviada</span>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px">
          <button type="button" style="font: inherit; font-weight: 700; font-size: 15px; height: 46px; padding: 0 22px; border-radius: 999px; border: 1px solid #C9D3DF; background: #FFFFFF; color: #00152E">Cancelar</button>
          <button type="submit" style="font: inherit; font-weight: 700; font-size: 15px; height: 46px; padding: 0 28px; border-radius: 999px; border: 0; background: #0062DE; color: #FFFFFF">Comprar</button>
        </div>
      </form>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
